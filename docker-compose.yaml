services:
    kafka:
        image: apache/kafka:3.9.0
        container_name: kafka
        ports:
            - "9094:9094"
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: >
                INTERNAL_LISTENER://kafka:9092, CONTROLLER://localhost:9093, EXTERNAL_LISTENER://0.0.0.0:9094
            KAFKA_ADVERTISED_LISTENERS: >
                INTERNAL_LISTENER://kafka:9092, EXTERNAL_LISTENER://localhost:9094
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
                CONTROLLER:PLAINTEXT, INTERNAL_LISTENER:PLAINTEXT, EXTERNAL_LISTENER:PLAINTEXT
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL_LISTENER
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            KAFKA_NUM_PARTITIONS: 3
            CLUSTER_ID: "Mk3OEYBSD34fcwNTJENDM2Qk"
        networks:
            - project-net
    flink_jobmanager:
        build: flink_cluster
        container_name: flink_jobmanager
        hostname: jobmanager
        ports:
            - "8082:8082"
        command: jobmanager
        environment:
            - |
              FLINK_PROPERTIES=
              jobmanager.rpc.address: flink_jobmanager
              rest.address: jobmanager
              rest.port: 8082
              parallelism.default: 2
        networks:
            - project-net
    flink_taskmanager:
        build: flink_cluster
        hostname: taskmanager
        depends_on:
            - flink_jobmanager
        command: taskmanager
        deploy:
            replicas: 3
        environment:
            - |
              FLINK_PROPERTIES=
              jobmanager.rpc.address: flink_jobmanager
              taskmanager.numberOfTaskSlots: 6 
              parallelism.default: 2
        networks:
            - project-net
    flink_job:
        build: consumer_flink
        container_name: pyflink-job
        depends_on:
            - flink_jobmanager
        environment:
            - |
              FLINK_PROPERTIES=
              jobmanager.rpc.address: flink_jobmanager
        networks:
            - project-net
        tty: true
        stdin_open: true
        volumes:
            - ./consumer_flink:/consumer_flink
        command: [ "bash" ]

    # postgres:
    #     image: postgres:16
    #     container_name: my-postgres
